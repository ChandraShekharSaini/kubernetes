apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: frontend-books
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ChandraShekharSaini/kubernetes.git
    path: frontend/books
    targetRevision: main
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
